spring:
  config:
    activate:
      on-profile:
  datasource:
    url: "jdbc:mysql://localhost/seat_service"
    username: "root"
    password: "1234"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
        devtools:
          livereload:
            enabled: true
          restart:
            enabled: ture
          thymeleaf:
            cache: false
---
spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username:
    password:
    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true

---
spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB